<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0d0d0f">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="QuestDay">
<meta name="description" content="QuestDay — твой ежедневный квест и контроль важных дат">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.png" type="image/png">
<link rel="apple-touch-icon" href="icon.png">
<title>QuestDay</title>
<link href="https://fonts.googleapis.com/css2?family=Alumni+Sans+Pinstripe&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=JetBrains+Mono:wght@400;500&family=Manrope:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg:        #EEF7E4;
  --bg2:       #FFFFFF;
  --bg3:       #F4FBED;
  --border:    #D0E8B8;
  --border2:   #ABD887;
  --text:      #1C3A0E;
  --text2:     #4A6B3A;
  --text3:     #8AAA6A;
  --amber:     #ABD887;
  --amber2:    #7DB85A;
  --amber-dim: rgba(171,216,135,0.3);
  --teal:      #79C6F3;
  --teal-dim:  rgba(121,198,243,0.2);
  --red:       #D97D90;
  --red-dim:   rgba(217,125,144,0.15);
  --gold:      #E2C875;
  --radius:    16px;
  --radius-sm: 12px;
  --card1: #FEF3DC;
  --card2: #DEF2C4;
  --card3: #FAE0DF;
  --card4: #E2EEF3;
}

body {
  background: linear-gradient(160deg, #D1ECB5 0%, #C4FF5E 100%) fixed;
  scroll-behavior: smooth;
  color: var(--text);
  font-family: 'Manrope', sans-serif;
  font-size: 15px;
  line-height: 1.6;
  min-height: 100vh;
  padding-bottom: 4rem;
}
body::before { display: none; }

/* ========== НОВАЯ ШАПКА ========== */
header {
  position: relative;
  max-width: 860px;
  margin: 0 auto;
  border-radius: 0 0 24px 24px;
  overflow: hidden;
  height: 148px;
  display: flex;
  align-items: center;
  box-shadow: 0 4px 20px rgba(171,0,30,0.3);
  z-index: 10;
  background: transparent;
  padding-left: 110px;
}
.header-banner-bg {
  position: absolute; inset: 0;
  width: 100%; height: 100%;
  object-fit: cover; object-position: left center;
  z-index: 1; pointer-events: none;
}
.prize-zone {
  position: absolute;
  left: 0; top: 0; bottom: 0;
  width: 126px;
  z-index: 0;
  display: flex; align-items: center; justify-content: center;
}
.prize-photo {
  width: 110px; height: 110px; border-radius: 50%;
  object-fit: cover; margin-top: 8px; margin-left: 10px;
  display: block;
}
.prize-placeholder {
  width: 110px; height: 110px; border-radius: 50%;
  background: transparent;
  margin-top: 12px; margin-left: 12px;
  display: flex; align-items: center; justify-content: center;
  font-size: 26px;
}
.header-center {
  position: relative; z-index: 2; flex: 1;
  padding: 0 10px; color: #fff; text-align: center;
  margin-left: 0;
}
.header-cycle {
  font-family: 'Manrope', sans-serif; font-size: 11px; font-weight: 700;
  letter-spacing: 0.08em; text-transform: uppercase;
  color: rgba(255,255,255,0.9); margin-bottom: 3px;
}
.header-stars-row {
  display: flex; align-items: center; justify-content: center;
  gap: 7px; margin-bottom: 6px;
}
.header-star-icon { color: #FFD700; font-size: 16px; filter: drop-shadow(0 1px 2px rgba(0,0,0,0.3)); }
.header-stars-val { font-family: 'Manrope', sans-serif; font-size: 18px; font-weight: 700; color: #fff; line-height: 1; }
.header-progress-track {
  height: 7px; background: rgba(255,255,255,0.25);
  border-radius: 4px; overflow: hidden;
  margin: 0 auto 6px; max-width: 200px;
}
.header-progress-fill { height: 100%; background: #7BE854; border-radius: 4px; transition: width 0.5s ease; }
.header-date { font-family: 'Manrope', sans-serif; font-size: 12px; color: rgba(255,255,255,0.85); }
.header-icons {
  position: relative; z-index: 2;
  display: flex; flex-direction: column; gap: 8px;
  padding-right: 14px; flex-shrink: 0;
  pointer-events: all;
}
.header-icon-btn {
  width: 54px; height: 54px; border: none;
  background: transparent; cursor: pointer; padding: 0;
  display: flex; align-items: center; justify-content: center;
  transition: transform 0.15s, opacity 0.15s;
  border-radius: 50%; overflow: hidden;
}
.header-icon-btn:hover  { transform: scale(1.1); }
.header-icon-btn:active { transform: scale(0.95); }
.header-icon-btn img { width: 54px; height: 54px; object-fit: cover; display: block; border-radius: 50%; }
.header-icon-btn.dates-active { opacity: 0.65; }

/* ========== MAIN ========== */
main { position: relative; z-index: 1; max-width: 860px; margin: 0 auto; padding: 0 1rem; }

/* ========== TABS BAR (скрыт — навигация через иконки шапки) ========== */
.tabs-bar { display: none; }
.tab-btn  { display: none; }

/* ========== ADD BUTTON ========== */
.add-btn {
  display: flex; align-items: center; gap: 8px;
  background: #ABD887; color: #1C3A0E;
  border: none; border-radius: var(--radius-sm);
  padding: 12px 18px;
  font-family: 'Manrope', sans-serif; font-size: 14px; font-weight: 700;
  cursor: pointer; transition: all 0.15s;
  width: 100%; justify-content: center; margin-bottom: 16px;
  box-shadow: 0 2px 8px rgba(171,216,135,0.4);
}
.add-btn:hover  { background: #7DB85A; color: #fff; transform: translateY(-1px); }
.add-btn:active { transform: scale(0.98); }
.add-btn svg    { width: 16px; height: 16px; }

/* ========== MODAL ========== */
.overlay {
  display: none; position: fixed; inset: 0;
  background: rgba(28,58,14,0.45); z-index: 100;
  align-items: center; justify-content: center;
  padding: 1rem; backdrop-filter: blur(6px);
}
.overlay.open { display: flex; }
.modal {
  background: #FFFFFF; border: 1px solid var(--border);
  border-radius: var(--radius); padding: 2rem;
  width: 100%; max-width: 440px;
  animation: popIn 0.2s ease;
  box-shadow: 0 8px 32px rgba(28,58,14,0.12);
  max-height: 90vh; overflow-y: auto;
}
@keyframes popIn {
  from { opacity: 0; transform: scale(0.95) translateY(8px); }
  to   { opacity: 1; transform: scale(1)    translateY(0);   }
}
.modal h2 { font-family: 'Cormorant Garamond', serif; font-size: 1.5rem; font-weight: 600; margin-bottom: 1.5rem; color: var(--text); }
.field { margin-bottom: 1rem; }
.field label { display: block; font-size: 12px; font-weight: 700; color: var(--text2); letter-spacing: 0.06em; text-transform: uppercase; margin-bottom: 6px; }
.field input, .field select, .field textarea {
  width: 100%; background: var(--bg3);
  border: 1.5px solid var(--border); border-radius: var(--radius-sm);
  padding: 10px 12px; color: var(--text);
  font-family: 'Manrope', sans-serif; font-size: 14px;
  outline: none; transition: border-color 0.15s;
  appearance: none; -webkit-appearance: none;
}
.field input[type="date"] { color-scheme: light; }
.field input:focus, .field select:focus, .field textarea:focus { border-color: var(--amber2); box-shadow: 0 0 0 3px var(--amber-dim); }
.field textarea { resize: vertical; min-height: 72px; }

.reminder-toggle { display: flex; align-items: center; gap: 10px; background: var(--bg3); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 10px 12px; cursor: pointer; user-select: none; transition: border-color 0.15s; }
.reminder-toggle:hover { border-color: var(--border2); }
.reminder-toggle.active { border-color: var(--amber); background: var(--amber-dim); }
.toggle-dot { width: 36px; height: 20px; background: var(--bg); border: 1px solid var(--border2); border-radius: 10px; position: relative; transition: background 0.2s; flex-shrink: 0; }
.toggle-dot::after { content: ''; position: absolute; width: 14px; height: 14px; border-radius: 50%; background: var(--text3); top: 2px; left: 2px; transition: transform 0.2s, background 0.2s; }
.reminder-toggle.active .toggle-dot { background: var(--amber2); border-color: var(--amber); }
.reminder-toggle.active .toggle-dot::after { transform: translateX(16px); background: #fff; }
.toggle-label { font-size: 14px; color: var(--text2); }
.reminder-toggle.active .toggle-label { color: var(--amber); }
.reminder-days-row { display: none; gap: 8px; margin-top: 8px; flex-wrap: wrap; }
.reminder-days-row.visible { display: flex; }
.day-chip { padding: 4px 10px; border-radius: 20px; border: 1px solid var(--border2); font-size: 12px; color: var(--text2); cursor: pointer; background: var(--bg3); transition: all 0.15s; user-select: none; }
.day-chip.selected { background: var(--amber-dim); border-color: var(--amber); color: var(--amber); }
.modal-actions { display: flex; gap: 8px; margin-top: 1.5rem; }
.btn-save { flex: 1; background: #ABD887; color: #1C3A0E; border: none; border-radius: var(--radius-sm); padding: 11px; font-family: 'Manrope', sans-serif; font-weight: 700; font-size: 14px; cursor: pointer; transition: all 0.15s; box-shadow: 0 2px 8px rgba(171,216,135,0.4); }
.btn-save:hover { background: #7DB85A; color: #fff; }
.btn-cancel { background: var(--bg3); color: var(--text2); border: 1.5px solid var(--border); border-radius: var(--radius-sm); padding: 10px 16px; font-family: 'Manrope', sans-serif; font-size: 14px; cursor: pointer; transition: all 0.15s; }
.btn-cancel:hover { border-color: var(--border2); color: var(--text); }

/* ========== EVENTS ========== */
.empty-state { text-align: center; padding: 4rem 2rem; color: var(--text3); }
.empty-state svg { opacity: 0.3; margin-bottom: 1rem; }
.empty-state p { font-size: 14px; }
.events-grid { display: flex; flex-direction: column; gap: 3px; }
.event-card { background: var(--bg2); border: 1px solid var(--border); border-left: 3px solid transparent; border-radius: var(--radius-sm); padding: 7px 10px 7px 12px; display: flex; flex-direction: column; gap: 2px; animation: fadeSlide 0.3s ease; transition: border-color 0.2s, background 0.15s; }
.event-card:hover { background: var(--bg3); }
@keyframes fadeSlide { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
.event-card.past       { border-left-color: var(--text3); }
.event-card.future     { border-left-color: var(--amber); }
.event-card.today-card { border-left-color: var(--teal);  }
.card-row1 { display: flex; align-items: center; gap: 8px; }
.event-name { font-size: 14px; font-weight: 600; color: var(--text); flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; line-height: 1.3; }
.event-date { font-family: 'JetBrains Mono', monospace; font-size: 12px; color: var(--text3); white-space: nowrap; flex-shrink: 0; }
.reminder-icon { color: var(--amber); flex-shrink: 0; display: flex; align-items: center; }
.reminder-icon svg { width: 13px; height: 13px; }
.event-card { cursor: pointer; transition: all 0.15s; }
.events-grid .event-card:nth-child(4n+1) { background: var(--card1); border-color: #f0d898; }
.events-grid .event-card:nth-child(4n+2) { background: var(--card2); border-color: #b8e098; }
.events-grid .event-card:nth-child(4n+3) { background: var(--card3); border-color: #f0b8c0; }
.events-grid .event-card:nth-child(4n+0) { background: var(--card4); border-color: #a8cce8; }
.event-card:hover { filter: brightness(0.96); transform: translateY(-1px); box-shadow: 0 4px 14px rgba(28,58,14,0.12); }
.cat-emoji-inline { font-size: 12px; margin-left: 4px; vertical-align: middle; line-height: 1; }
.card-row2 { font-family: 'JetBrains Mono', monospace; font-size: 12px; color: var(--text2); padding-left: 1px; display: flex; align-items: center; }
.card-row2 > span:first-child { flex: 0 0 52%; }
.card-row2 > span:last-child  { flex: 0 0 48%; text-align: left; }
.lbl-passed    { color: #60a5fa; }
.lbl-remaining { color: var(--amber); }
.future .card-row2 .lbl-remaining strong { color: var(--amber); }
.past   .card-row2 .lbl-remaining strong { color: var(--amber); }
.card-row3 { font-size: 11px; color: var(--text3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding-left: 1px; line-height: 1.4; }

/* ========== DRAWER ========== */
.drawer-overlay { position: fixed; inset: 0; background: rgba(28,58,14,0.45); z-index: 200; opacity: 0; pointer-events: none; transition: opacity 0.25s; }
.drawer-overlay.open { opacity: 1; pointer-events: all; }
.drawer { position: fixed; top: 0; right: 0; bottom: 0; width: 290px; max-width: 88vw; background: #FFFFFF; border-left: 1px solid var(--border); z-index: 201; transform: translateX(100%); transition: transform 0.3s cubic-bezier(0.4,0,0.2,1); display: flex; flex-direction: column; overflow: hidden; }
.drawer-overlay.open .drawer { transform: translateX(0); }
.drawer-head { padding: 18px 16px 14px; border-bottom: 1px solid var(--border); background: linear-gradient(135deg, #ABD887, #DEF2C4); position: relative; }
.drawer-close { position: absolute; top: 12px; right: 12px; width: 28px; height: 28px; border-radius: 6px; border: none; background: transparent; color: var(--text3); cursor: pointer; font-size: 16px; display: flex; align-items: center; justify-content: center; transition: all 0.15s; }
.drawer-close:hover { background: var(--bg3); color: var(--text); }
.drawer-ev-name { font-size: 15px; font-weight: 700; color: var(--text); margin-bottom: 4px; padding-right: 32px; line-height: 1.3; }
.drawer-ev-meta { font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--text3); display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.drawer-ev-cat { font-size: 10px; padding: 1px 7px; border-radius: 10px; font-weight: 600; }
.drawer-actions { padding: 6px 0; overflow-y: auto; flex: 1; }
.drawer-btn { display: flex; align-items: center; gap: 14px; width: 100%; padding: 14px 20px; background: transparent; border: none; color: var(--text); cursor: pointer; font-family: 'Manrope', sans-serif; font-size: 14px; text-align: left; transition: background 0.15s; border-radius: 0; }
.drawer-btn:hover { background: var(--bg3); }
.drawer-btn.danger { color: var(--red); }
.drawer-btn svg { width: 18px; height: 18px; color: var(--text3); flex-shrink: 0; }
.drawer-btn.danger svg { color: var(--red); }
.drawer-btn.done-active svg { color: var(--teal); }
.drawer-btn.done-active { color: var(--teal); }
.drawer-sep { height: 1px; background: var(--border); margin: 4px 20px; }

/* ========== TYPE TOGGLE / CAT PICKER / COLOR ========== */
.type-toggle { display: flex; border: 1px solid var(--border); border-radius: var(--radius-sm); overflow: hidden; width: fit-content; margin-top: 4px; }
.type-btn { padding: 6px 18px; font-size: 13px; background: transparent; color: var(--text2); border: none; cursor: pointer; font-family: 'Manrope', sans-serif; transition: all 0.15s; }
.type-btn + .type-btn { border-left: 1px solid var(--border); }
.type-btn:hover  { background: var(--bg3); color: var(--text); }
.type-btn.active { background: var(--amber-dim); color: var(--amber); font-weight: 600; }
.cat-picker { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; }
.cat-chip { font-size: 12px; padding: 5px 12px; border-radius: 20px; border: 1px solid var(--border); background: var(--bg3); color: var(--text2); cursor: pointer; transition: all 0.15s; white-space: nowrap; user-select: none; }
.cat-chip:hover { border-color: var(--border2); color: var(--text); }
.cat-chip.selected { font-weight: 700; }
.color-swatches { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 6px; align-items: center; }
.color-swatch { width: 22px; height: 22px; border-radius: 50%; cursor: pointer; border: 2px solid transparent; transition: transform 0.15s, border-color 0.15s; flex-shrink: 0; }
.color-swatch:hover { transform: scale(1.2); }
.color-swatch.selected { border-color: var(--text) !important; transform: scale(1.15); }
.swatch-custom { width: 22px; height: 22px; border-radius: 50%; cursor: pointer; flex-shrink: 0; background: conic-gradient(red, yellow, lime, cyan, blue, magenta, red); border: 2px solid transparent; position: relative; overflow: hidden; transition: transform 0.15s; }
.swatch-custom:hover { transform: scale(1.2); }
.swatch-custom input[type=color] { position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; height: 100%; border: none; padding: 0; }

/* ========== CAT FILTER BAR ========== */
.cat-filter-bar { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }
.cat-filter-btn { font-size: 11px; padding: 3px 11px; border-radius: 20px; border: 1px solid var(--border); background: var(--bg2); color: var(--text3); cursor: pointer; transition: all 0.15s; white-space: nowrap; font-family: 'Manrope', sans-serif; }
.cat-filter-btn:hover  { background: var(--bg3); color: var(--text2); }
.cat-filter-btn.active { color: var(--text); border-color: var(--border2); font-weight: 600; background: var(--bg3); }

/* ========== TOAST ========== */
#toast-container { position: fixed; bottom: 24px; right: 24px; z-index: 999; display: flex; flex-direction: column; gap: 8px; pointer-events: none; }
.toast { background: var(--bg2); border: 1px solid var(--border2); border-left: 3px solid var(--amber); border-radius: var(--radius-sm); padding: 12px 16px; color: var(--text); font-size: 13px; max-width: 300px; animation: toastIn 0.3s ease; pointer-events: all; }
.toast strong { color: var(--amber); }
@keyframes toastIn { from { opacity: 0; transform: translateX(20px); } to { opacity: 1; transform: translateX(0); } }

/* ========== SECTIONS / SORT / TOOLBAR ========== */
.section-label { font-size: 11px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: var(--text3); margin-bottom: 12px; padding-bottom: 8px; border-bottom: 1px solid var(--border); }
.section + .section { margin-top: 2.5rem; }
.sort-bar { display: flex; gap: 6px; margin-bottom: 10px; }
.sort-btn { flex: 1; padding: 7px 4px; border-radius: var(--radius-sm); border: 1px solid var(--border); background: var(--bg2); color: var(--text3); font-size: 12px; font-weight: 600; font-family: 'Manrope', sans-serif; cursor: pointer; text-align: center; transition: all 0.15s; }
.sort-btn:hover  { background: var(--bg3); color: var(--text2); }
.sort-btn.active { background: var(--amber-dim); border-color: var(--amber); color: var(--amber); }
.toolbar-row { display: flex; gap: 6px; margin-top: 8px; }
.tool-btn { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 8px 4px; border: 1.5px solid var(--border); border-radius: var(--radius-sm); background: #fff; color: var(--text2); cursor: pointer; font-family: 'Manrope', sans-serif; font-size: 10px; font-weight: 700; letter-spacing: 0.02em; transition: all 0.15s; white-space: nowrap; box-shadow: 0 1px 4px rgba(28,58,14,0.06); }
.tool-btn svg   { width: 15px; height: 15px; }
.tool-btn:hover { color: #1C3A0E; border-color: #ABD887; background: var(--bg3); }

/* ========== MINI CALENDAR ========== */
.cal-widget { background: var(--bg2); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px 16px 10px; margin-bottom: 14px; display: none; }
.cal-widget.open { display: block; }
.cal-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
.cal-nav { width: 28px; height: 28px; border: 1px solid var(--border); border-radius: 6px; background: transparent; color: var(--text2); cursor: pointer; font-size: 15px; display: flex; align-items: center; justify-content: center; transition: all 0.15s; line-height: 1; }
.cal-nav:hover { border-color: var(--amber); color: var(--amber); }
.cal-title { font-size: 13px; font-weight: 700; color: var(--text); letter-spacing: 0.03em; cursor: pointer; user-select: none; }
.cal-title:hover { color: var(--amber); }
.cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; }
.cal-day-name { text-align: center; font-size: 9px; font-weight: 700; color: var(--text3); padding: 3px 0; letter-spacing: 0.06em; text-transform: uppercase; }
.cal-day { text-align: center; padding: 3px 1px; border-radius: 6px; cursor: default; display: flex; flex-direction: column; align-items: center; gap: 2px; min-height: 34px; }
.cal-day-num { font-size: 11px; font-family: 'JetBrains Mono', monospace; color: var(--text2); width: 20px; height: 20px; display: flex; align-items: center; justify-content: center; border-radius: 50%; line-height: 1; flex-shrink: 0; }
.cal-day.other-month .cal-day-num { color: var(--text3); opacity: 0.35; }
.cal-day.is-today .cal-day-num { background: var(--amber); color: #000; font-weight: 700; }
.cal-day.has-event { cursor: pointer; }
.cal-day.has-event:hover { background: var(--bg3); }
.cal-day.cal-selected { background: var(--bg3); outline: 1px solid var(--border2); }
.cal-dots { display: flex; gap: 2px; flex-wrap: wrap; justify-content: center; }
.cal-dot  { width: 4px; height: 4px; border-radius: 50%; flex-shrink: 0; }
.cal-filter-hint { font-size: 11px; color: var(--amber); text-align: center; margin-top: 8px; cursor: pointer; padding: 2px; }
.cal-filter-hint:hover { text-decoration: underline; }

/* ========== ARCHIVE / DONE ========== */
.event-card.done { opacity: 0.5; }
.event-card.done .event-name { text-decoration: line-through; color: var(--text3); }
.archive-toggle { display: flex; align-items: center; gap: 8px; font-size: 12px; font-weight: 600; color: var(--text3); cursor: pointer; padding: 10px 0 6px; border-top: 1px solid var(--border); margin-top: 12px; user-select: none; letter-spacing: 0.04em; text-transform: uppercase; transition: color 0.15s; }
.archive-toggle:hover { color: var(--text2); }
.archive-toggle svg { width: 12px; height: 12px; transition: transform 0.2s; flex-shrink: 0; }
.archive-toggle.open svg { transform: rotate(90deg); }

/* ========== CAT MANAGER ========== */
.cat-mgr-list { margin-bottom: 16px; }
.cat-mgr-item { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--border); }
.cat-mgr-item:last-child { border-bottom: none; }
.cat-mgr-emoji { font-size: 18px; flex-shrink: 0; }
.cat-mgr-dot   { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
.cat-mgr-name  { flex: 1; font-size: 13px; font-weight: 600; color: var(--text); }
.cat-mgr-del { width: 26px; height: 26px; border: none; background: transparent; color: var(--text3); cursor: pointer; border-radius: 5px; display: flex; align-items: center; justify-content: center; transition: all 0.15s; }
.cat-mgr-del:hover { color: var(--red); background: var(--red-dim); }
.cat-mgr-del svg { width: 13px; height: 13px; }
.add-cat-row { display: grid; grid-template-columns: 48px 1fr 36px; gap: 8px; align-items: center; margin-top: 10px; }
.inp-emoji { text-align: center; font-size: 20px; background: var(--bg3); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 6px 4px; color: var(--text); width: 100%; outline: none; }
.inp-emoji:focus { border-color: var(--amber); }
.inp-catname { background: var(--bg3); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 7px 10px; color: var(--text); font-size: 13px; font-family: 'Manrope', sans-serif; outline: none; width: 100%; }
.inp-catname:focus { border-color: var(--amber); }
.inp-cat-color { width: 36px; height: 36px; border-radius: 50%; border: 2px solid var(--border); cursor: pointer; padding: 0; background: transparent; }
.btn-add-cat { margin-top: 12px; width: 100%; background: var(--amber-dim); color: var(--amber); border: 1px solid var(--amber); border-radius: var(--radius-sm); padding: 8px; font-family: 'Manrope', sans-serif; font-size: 13px; font-weight: 600; cursor: pointer; transition: all 0.15s; }
.btn-add-cat:hover { background: var(--amber); color: #000; }

/* ========== DIRECTION PICKER ========== */
.dir-pick-overlay { position: fixed; inset: 0; background: rgba(28,58,14,0.45); z-index: 300; display: flex; align-items: flex-end; justify-content: center; opacity: 0; pointer-events: none; transition: opacity 0.2s; backdrop-filter: blur(4px); }
.dir-pick-overlay.open { opacity: 1; pointer-events: all; }
.dir-pick-sheet { background: #fff; border-radius: 20px 20px 0 0; padding: 20px 16px 32px; width: 100%; max-width: 500px; transform: translateY(100%); transition: transform 0.3s cubic-bezier(0.4,0,0.2,1); }
.dir-pick-overlay.open .dir-pick-sheet { transform: translateY(0); }
.dir-pick-title { font-size: 15px; font-weight: 700; color: var(--text); margin-bottom: 14px; text-align: center; }
.dir-pick-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 14px; }
.dir-pick-chip { display: flex; align-items: center; gap: 8px; padding: 10px 12px; border: 1.5px solid var(--border); border-radius: var(--radius-sm); background: var(--bg3); cursor: pointer; transition: all 0.15s; font-size: 12px; font-weight: 600; color: var(--text2); }
.dir-pick-chip:hover { border-color: #ABD887; background: var(--card2); color: var(--text); }
.dir-pick-chip.selected { border-color: #ABD887; background: var(--card2); color: #1C3A0E; }

/* ========== RESULT SCREEN ========== */
.result-screen { text-align: center; padding: 2rem 0; display: flex; flex-direction: column; align-items: center; gap: 0; }
.result-icon   { font-size: 4rem; margin-bottom: 12px; animation: popIn 0.4s ease; }
.result-title  { font-family: 'Cormorant Garamond', serif; font-size: 1.8rem; font-weight: 700; color: var(--text); margin-bottom: 6px; }
.result-subtitle { font-size: 13px; color: var(--text3); margin-bottom: 24px; }
.result-stats  { width: 100%; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 20px; }
.result-stat   { background: var(--bg2); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 14px 10px; }
.result-stat-val { font-size: 1.5rem; font-weight: 700; color: var(--amber); line-height: 1; margin-bottom: 4px; }
.result-stat-lbl { font-size: 11px; color: var(--text3); font-weight: 600; letter-spacing: 0.04em; }
.result-prize-box { width: 100%; background: var(--amber-dim); border: 1px solid var(--amber); border-radius: var(--radius-sm); padding: 16px; margin-bottom: 20px; }
.result-prize-lbl { font-size: 11px; color: var(--amber); font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; margin-bottom: 6px; }
.result-prize-val { font-size: 16px; font-weight: 700; color: var(--text); }
.result-missed-box { width: 100%; background: var(--bg2); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 14px; margin-bottom: 20px; font-size: 13px; color: var(--text2); line-height: 1.5; }
.result-btn { width: 100%; padding: 14px; border: none; border-radius: var(--radius-sm); font-family: 'Manrope', sans-serif; font-size: 14px; font-weight: 700; cursor: pointer; transition: opacity 0.15s; }
.result-btn.win  { background: var(--amber); color: #000; }
.result-btn.lose { background: var(--bg3); color: var(--text); border: 1px solid var(--border); }
.result-btn:hover { opacity: 0.85; }
.btn-edit-profile { width: 100%; padding: 10px; margin-top: 10px; border: 1px solid var(--border); border-radius: var(--radius-sm); background: transparent; color: var(--text3); font-family: 'Manrope', sans-serif; font-size: 12px; cursor: pointer; transition: all 0.15s; }
.btn-edit-profile:hover { color: var(--text2); border-color: var(--border2); }

/* ========== НОВАЯ КАРТОЧКА ЗАДАНИЯ ========== */
.quest-card-wrapper {

}

/* Кнопки на зелёном фоне враппера */

.quest-answered { text-align: center; padding: 22px 0; }

/* ========== ПОЛЕ «ПОСЛЕДНИЕ 6 ДНЕЙ» ========== */
/* ═══ ПОЛЕ «6 ДНЕЙ» ═════════════════════════════════════════
   aspect-ratio: 707/231 = точные пропорции field.png
   Фон не растягивается по высоте.

   ПОЗИЦИИ КРУЖКОВ (data-slot="1"..,"6"):
   left  = смещение слева (% ширины поля)
   top   = смещение сверху (px или %)
   Меняй каждый кружок отдельно!
═══════════════════════════════════════════════════════════ */
.quest-field {
  position: relative;
  aspect-ratio: 707 / 231; /* точный размер field.png */
  width: 100%;
  background-image: url('field.png');
  background-size: 100% 100%;
  background-repeat: no-repeat;
  border-radius: 28px;
  border: 4px solid #5AAA20;
  margin-bottom: 12px;
  background-color: #C8F07A;
  overflow: visible;
}

/* Флекс-строка убрана — теперь каждый слот абсолютный */
.field-row  { position: absolute; inset: 0; }
.field-slot { position: absolute; display: flex; flex-direction: column; align-items: center; gap: 3px; transform: translateX(-50%); }

/* ── ПОЗИЦИИ КРУЖКОВ — редактируй здесь ─────────────────
   left: % от ширины поля (центр кружка)
   top:  % от высоты поля (верх score-текста)        */
.field-slot[data-slot="1"] { left: 9.3%;  top: 38%; }
.field-slot[data-slot="2"] { left: 26%; top: 25%; }
.field-slot[data-slot="3"] { left: 42%; top: 38%; }
.field-slot[data-slot="4"] { left: 58%; top: 25%; }
.field-slot[data-slot="5"] { left: 75%; top: 38%; }
.field-slot[data-slot="6"] { left: 91.2%; top: 25%; }
.field-score { font-family: 'Manrope', sans-serif; font-size: 11px; font-weight: 700; height: 16px; line-height: 16px; text-align: center; }
.field-score.pos  { color: #1C5000; }
.field-score.neg  { color: #7A1010; }
.field-score.zero { color: #5A8A4A; }
.field-score.none { color: transparent; }
.field-circle { width: 48px; height: 48px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-family: 'JetBrains Mono', monospace; font-size: 13px; font-weight: 700; color: #fff; position: relative; flex-shrink: 0; transition: transform 0.15s; }
.field-circle.is-today   { box-shadow: 0 0 0 3px #fff, 0 0 0 5.5px #57C300; }
.field-circle.done       { background: #57C300; }
.field-circle.frozen     { background: #4ABDE8; }
.field-circle.missed     { background: #D94444; }
.field-circle.skipped    { background: #C0C0B0; color: #6A6A5A; }
.field-circle.future     { background: #A8C880; color: #4A6B30; }
.field-circle.today-empty{ background: #A0DC50; color: #2A5000; }
.field-chin { width: 36px; height: 15px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-family: 'Manrope', sans-serif; font-size: 9px; font-weight: 700; letter-spacing: 0.04em; margin-top: -1px; }
.field-chin.done       { background: #45A000; color: #fff; }
.field-chin.frozen     { background: #38A8D0; color: #fff; }
.field-chin.missed     { background: #B83030; color: #fff; }
.field-chin.skipped    { background: #A0A090; color: #fff; }
.field-chin.future     { background: #88B860; color: #3A5A20; }
.field-chin.today-empty{ background: #7ACC20; color: #1C4000; }

/* ========== ЗАГРУЗКА КВЕСТА ========== */

/* ========== ПРОФИЛЬ (новый) ========== */

.prf-dir-chip { display: flex; align-items: center; gap: 8px; padding: 9px 10px; border-radius: 12px; border: 1.5px solid #D0E8B8; background: #FFFFFF; cursor: pointer; transition: all 0.15s; user-select: none; }

/* ╔══════════════════════════════════════════════════════╗
   ║        НАСТРОЙКИ ПОЗИЦИЙ — РЕДАКТИРУЙ ЗДЕСЬ          ║
   ╠══════════════════════════════════════════════════════╣
   ║  ИКОНКИ (Настройки / Календарь):                     ║
   ║    Поиск: .header-icon-btn {                          ║
   ║    width / height — размер иконки                     ║
   ║                                                       ║

let questProfile = JSON.parse(localStorage.getItem('quest_profile') || 'null');

const DIRECTIONS = [
  { key: 'physical',     emoji: '🏃', label: 'Физическое развитие',  skills: ['Бег','Зарядка','Йога','Плавание','Силовые тренировки'] },

  { key: 'creative',     emoji: '🎨', label: 'Творчество',            skills: ['Рисование','Фотография','Музыка','Письмо','Дизайн'] },

  { key: 'curiosity',    emoji: '🌍', label: 'Любознательность',      skills: ['Факты о мире','Документалки','История','Наука','Культуры мира'] },
  { key: 'finance',      emoji: '💰', label: 'Финансы',               skills: ['Бюджет','Инвестиции','Сбережения','Финансовая грамотность'] },
  { key: 'social',       emoji: '🤝', label: 'Социальное',            skills: ['Новые знакомства','Волонтёрство','Эмпатия','Сообщества'] },
  { key: 'health',       emoji: '❤️', label: 'Здоровье',              skills: ['Питание','Сон','Вода','Витамины','Профилактика'] },
];

const MONTHS_RU  = ['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
const DAYS_SHORT = ['Пн','Вт','Ср','Чт','Пт','Сб','Вс'];

/* ===== DATE UTILS ===== */
function today() { const d = new Date(); return new Date(d.getFullYear(), d.getMonth(), d.getDate()); }
function parseDate(str) { const [y,m,d] = str.split('-').map(Number); return new Date(y,m-1,d); }
function diffDays(dateStr) { return Math.round((parseDate(dateStr) - today()) / 86400000); }
function formatDateRu(dateStr) {
  const months = ['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
  const d = parseDate(dateStr);
  return `${d.getDate()} ${months[d.getMonth()]} ${d.getFullYear()}`;
}
function todayStr() { const d = today(); return `${String(d.getDate()).padStart(2,'0')}.${String(d.getMonth()+1).padStart(2,'0')}.${d.getFullYear()}`; }
function toInputDate(d) { return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }
function questDateKey(d) { return d.toISOString().slice(0,10); }
function addDays(date,n) { return new Date(date.getFullYear(), date.getMonth(), date.getDate()+n); }
function escapeHtml(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

/* ===== HEADER ===== */
function updateQuestHeader() {
  const cycle = getQuestCycle && getQuestCycle();
  const stars  = typeof questStarsThisMonth === 'function' ? questStarsThisMonth() : 0;
  const goal   = questProfile ? (questProfile.monthGoal || 35) : 35;
  const pct    = Math.min(100, Math.max(0, Math.round(stars / goal * 100)));
  const el = id => document.getElementById(id);
  if (cycle && el('header-cycle-label')) el('header-cycle-label').textContent = `ЦИКЛ ${cycle.idx+1} · ДЕНЬ ${cycle.dayInCycle} из 30`;
  if (el('header-stars-val'))    el('header-stars-val').textContent = `${stars} / ${goal}`;
  if (el('header-progress-fill')) el('header-progress-fill').style.width = pct + '%';
  if (el('header-date-label')) {
    const d = new Date();
    const days   = ['воскресенье','понедельник','вторник','среда','четверг','пятница','суббота'];
    const months = ['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
    el('header-date-label').textContent = `${days[d.getDay()]}, ${d.getDate()} ${months[d.getMonth()]} ${d.getFullYear()}`;
  }
  const img = localStorage.getItem('quest_prize_image');
  const zone = el('header-prize-zone');
  if (zone && img) zone.innerHTML = `<img src="${img}" class="prize-photo" alt="Приз">`;
}

/* ===== TABS ===== */
function switchTab(tab) {
  activeTab = tab;
  document.getElementById('tab-dates').style.display = tab === 'dates' ? '' : 'none';
  document.getElementById('tab-quest').style.display = tab === 'quest' ? '' : 'none';
  const calIcon = document.getElementById('header-cal-icon');
  if (calIcon) calIcon.classList.toggle('dates-active', tab === 'dates');
  if (tab === 'quest') renderQuestRoot();
  if (tab === 'dates') { renderEvents(); }
}

function toggleDatesTab() { switchTab(activeTab === 'dates' ? 'quest' : 'dates'); }

function openHeaderSettings() {
  switchTab('quest');
  renderProfileForm(questProfile);
}

/* ===== SORT ===== */
function setSort(btn, type) {
  currentSort = type;
  document.querySelectorAll('.sort-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  renderEvents();
}
function daysUntilNext(dateStr) {
  const t = today(), p = parseDate(dateStr);
  let next = new Date(t.getFullYear(), p.getMonth(), p.getDate());
  if (next <= t) next = new Date(t.getFullYear()+1, p.getMonth(), p.getDate());
  return Math.round((next - t) / 86400000);
}
function isUpcomingThisYear(dateStr) {
  const t = today(), p = parseDate(dateStr);
  return new Date(t.getFullYear(), p.getMonth(), p.getDate()) >= t;
}
function sortedEvents() {
  const arr = [...events];
  if (currentSort === 'closest') arr.sort((a,b) => daysUntilNext(a.date) - daysUntilNext(b.date));
  else arr.sort((a,b) => (b.createdAt||0) - (a.createdAt||0));
  return arr;
}

/* ===== QUEST CYCLES ===== */
function getQuestCycle() {
  const startStr = localStorage.getItem('quest_start_date');
  if (!startStr) return null;
  const start    = parseDate(startStr);
  const t        = today();
  const diff     = Math.floor((t.getTime() - start.getTime()) / 86400000);
  const idx      = Math.floor(Math.max(0,diff) / 30);
  return { idx, start: addDays(start,idx*30), end: addDays(start,(idx+1)*30-1), dayInCycle: (diff%30)+1, totalDays: 30, globalStart: start };
}
function starsInRange(fromDate, toDate) {
  let stars = 0;
  Object.entries(questLog).forEach(([key,v]) => {
    const ds = key.slice(0,10);
    if (ds.length < 10) return;
    try { const d = parseDate(ds); if (d >= fromDate && d <= toDate) stars += (v.stars||0); } catch(e) {}
  });
  return stars;
}
function questStarsThisMonth() {
  const cycle = getQuestCycle();
  if (!cycle) return 0;
  const t = today();
  let stars = starsInRange(cycle.start, t);
  let cur = new Date(cycle.start);
  const yesterday = addDays(t,-1);
  while (cur <= yesterday && cur < t) {
    const entry = questLog[questDateKey(cur)];
    if (!entry || entry.done === undefined) stars -= 1;
    cur = addDays(cur,1);
  }
  return stars;
}
function questStreakDays() {
  let streak = 0;
  const t = today();
  for (let i = 0; i < 60; i++) {
    const d = new Date(t.getFullYear(), t.getMonth(), t.getDate()-i);
    const log = questLog[questDateKey(d)];
    if (!log || log.done === undefined) break;
    if (log.done) streak++; else break;
  }
  return streak;
}
function calcCycleStats(fromDate, toDate) {
  let stars=0, daysLogged=0, daysDone=0, bestStreak=0, cur2=0;
  let d = new Date(fromDate);
  while (d <= toDate) {
    const key = questDateKey(d), entry = questLog[key];
    if (entry?.done===true)  { daysLogged++; daysDone++; stars+=(entry.stars||0); cur2++; bestStreak=Math.max(bestStreak,cur2); }
    else if (entry?.done===false) { daysLogged++; stars+=(entry.frozen?0:-1); cur2=0; }
    else { stars-=1; cur2=0; }
    d = addDays(d,1);
  }
  Object.entries(questLog).forEach(([key,v]) => {
    if (!key.includes('_')) return;
    const ds = key.slice(0,10);
    try { const dd = parseDate(ds); if (dd>=fromDate && dd<=toDate) stars+=(v.stars||0); } catch(e) {}
  });
  return { stars, daysLogged, daysDone, bestStreak };
}

/* ===== MONTH END ===== */
function checkMonthEnd() {
  if (!questProfile) return;
  const cycle = getQuestCycle();
  if (!cycle || cycle.idx===0) return;
  const months = JSON.parse(localStorage.getItem('quest_months')||'{}');
  const prevKey = `cycle_${cycle.idx-1}`;
  if (months[prevKey]) return;
  const start    = cycle.globalStart;
  const prevStart = addDays(start,(cycle.idx-1)*30);
  const prevEnd   = addDays(start,cycle.idx*30-1);
  const stats     = calcCycleStats(prevStart, prevEnd);
  const fullCycle = stats.daysDone===30;
  if (fullCycle) {
    const bonusKey = `${questDateKey(prevEnd)}_bonus_fullmonth`;
    if (!questLog[bonusKey]) { questLog[bonusKey]={stars:15,type:'fullmonth_bonus'}; localStorage.setItem('quest_log',JSON.stringify(questLog)); stats.stars+=15; }
  }
  const result = { ...stats, goal:questProfile.monthGoal, prize:questProfile.monthPrize, cycleKey:prevKey, cycleNum:cycle.idx, win:stats.stars>=questProfile.monthGoal, fullMonthBonus:fullCycle, month:questDateKey(prevStart).slice(0,7) };
  months[prevKey]=result; localStorage.setItem('quest_months',JSON.stringify(months));
  pendingMonthResult=result;
}

/* ===== QUEST ROOT ===== */
function renderQuestRoot() {
  if (pendingMonthResult)   renderMonthResults(pendingMonthResult);
  else if (!questProfile)   renderProfileForm();
  else                      renderQuestScreen();
}

/* ===== QUEST SCREEN ===== */
function buildHistoryField() {
  const now = today();
  const slots = Array.from({length:6},(_,i) => {
    const d = addDays(now,i-5), key = questDateKey(d), log = questLog[key];
    const isToday=(i===5), isPast=(d<now), dayNum=d.getDate(), slotNum=i+1;
    let status, scoreVal, scoreClass;
    if (log?.done===true)                    { status='done';        scoreVal=`+${log.stars??2}`;            scoreClass='pos'; }
    else if (log?.done===false && log?.frozen){ status='frozen';      scoreVal='0';                           scoreClass='zero'; }
    else if (log?.done===false)               { status='missed';      scoreVal=`\u2212${Math.abs(log.stars??2)}`; scoreClass='neg'; }
    else if (isPast)                          { status='skipped';     scoreVal='\u22121';                     scoreClass='neg'; }
    else if (isToday)                         { status='today-empty'; scoreVal='';                            scoreClass='none'; }
    else                                      { status='future';      scoreVal='';                            scoreClass='none'; }
    const todayCls = isToday ? ' is-today' : '';
    return `<div class="field-slot" data-slot="${i+1}">
      <div class="field-score ${scoreClass}">${scoreVal||'&nbsp;'}</div>
      <div class="field-circle ${status}${todayCls}">${dayNum}</div>
      <div class="field-chin ${status}">${slotNum}&thinsp;д.</div>
    </div>`;
  });
  return `<div class="quest-field"><div class="field-row">${slots.join('')}</div></div>`;
}

function renderQuestScreen() {
  const root = document.getElementById('quest-root');
  updateQuestHeader();
  const now      = today();
  const todayKey = questDateKey(now);
  const todayLog = questLog[todayKey];
  const answered = todayLog && todayLog.done !== undefined;

  let taskInner, buttonsBlock = '';
  if (!todayLog || !todayLog.task) {
    taskInner = `<div class="quest-loading"><div class="quest-spinner"></div><span>Генерация задания...</span></div>`;
  } else if (answered) {
    const done=todayLog.done, col=done?'#2D8A00':'#C04040';
    const msg = done ? `Выполнено! +${todayLog.stars??2}\u2B50` : todayLog.frozen ? 'Пропущено \u00B7 0\u2B50 (\u2744\uFE0F)' : `Пропущено \u22122\u2B50`;
    taskInner = `<div class="quest-answered">
      <div class="quest-answered-icon" style="color:${col}">${done?'✓':'✗'}</div>
      <div class="quest-answered-text" style="color:${col}">${msg}</div>
      <div class="quest-answered-sub">${escapeHtml(todayLog.task?.title||'')}</div>
    </div>`;
  } else {
    const t=todayLog.task, frozen=!!todayLog.frozen;
    // Белая карточка — только лейбл, чипы, заголовок, описание
    taskInner = `
      <div class="quest-card-label">Задание на сегодня <span class="label-date">${new Date().toLocaleDateString('ru',{day:'numeric',month:'long'})}</span></div>
      <div class="quest-card-meta">
        <span class="quest-meta-chip cat">${escapeHtml(t.categoryEmoji||'')} ${escapeHtml(t.category||'')}</span>
        <span class="quest-meta-chip">${escapeHtml(t.duration||'')}</span>
        <span class="quest-meta-chip stars">\u2605\u2605</span>
        ${frozen?'<span class="quest-meta-chip" style="background:#E2EEF3;color:#1A7AB5">\u2744\uFE0F заморожен</span>':''}
      </div>
      <div class="quest-title">${escapeHtml(t.title)}</div>
      <div class="quest-desc">${escapeHtml(t.description)}</div>`;
    // Совет и кнопки — вне белой карточки, на зелёном фоне враппера
    buttonsBlock = `
      ${t.tip?`<div class="quest-tip">${escapeHtml(t.tip)}</div>`:''}
      <div class="quest-actions-main">
        <button class="quest-btn quest-btn-done"   onclick="markQuest(true)">Выполнено<span class="quest-btn-cost">+2\u2B50</span></button>
        <button class="quest-btn quest-btn-freeze" onclick="freezeDay()" ${frozen?'disabled':''}>Заморозить<span class="quest-btn-cost">\u22122\u2B50</span></button>
        <button class="quest-btn quest-btn-skip"   onclick="markQuest(false)">Пропустить<span class="quest-btn-cost">\u22122\u2B50</span></button>
      </div>
      <div class="quest-actions-spend">
        <button class="quest-btn quest-btn-spend" onclick="replaceTask()">🔄 Заменить<span class="quest-btn-cost">\u22122\u2B50</span></button>
        <button class="quest-btn quest-btn-spend" onclick="openDirPicker()">🎯 Тема<span class="quest-btn-cost">\u22122\u2B50</span></button>
        <button class="quest-btn quest-btn-spend" onclick="renderHistoryScreen()">📊 История<span class="quest-btn-cost"> </span></button>
      </div>`;
  }

  root.innerHTML = `
    <div class="quest-card-wrapper">
      <img src="tail.png"  class="quest-tail"  alt="" onerror="this.style.display='none'">
      <img src="robot.gif" class="quest-robot" alt="" onerror="this.style.display='none'">
      <div class="quest-dialogue-card">${taskInner}</div>
      ${typeof buttonsBlock !== 'undefined' ? buttonsBlock : ''}
    </div>
    ${buildHistoryField()}
    <button class="btn-edit-profile" onclick="openHeaderSettings()">\u2699 Изменить профиль</button>
    <button class="btn-edit-profile" style="margin-top:6px" onclick="renderHistoryScreen()">📊 История месяцев</button>
    <!-- ══ ТЕСТ: УДАЛИ ЭТИ ДВЕ КНОПКИ ПЕРЕД РЕЛИЗОМ ══ -->
    <button onclick="simulateNewDay()" style="margin-top:14px;width:100%;padding:10px;background:#fff3cd;color:#856404;border:1.5px dashed #ffc107;border-radius:12px;font-family:Manrope,sans-serif;font-size:12px;font-weight:700;cursor:pointer">
      🧪 Симулировать новый день
    </button>
    <button onclick="addTestStars()" style="margin-top:6px;width:100%;padding:10px;background:#fff3cd;color:#856404;border:1.5px dashed #ffc107;border-radius:12px;font-family:Manrope,sans-serif;font-size:12px;font-weight:700;cursor:pointer">
      🧪 +20 звёзд
    </button>`;

  if (!todayLog || !todayLog.task) { if (!isGenerating) generateDailyTask(); }
}

function prfToggleDir(el, key) {
  if (selectedDirs.has(key)) { selectedDirs.delete(key); el.classList.remove('selected'); }
  else { selectedDirs.add(key); el.classList.add('selected'); }
}
function prfToggleAccordion() { document.getElementById('prf-api-accordion')?.classList.toggle('open'); }

/* ===== PROFILE SAVE ===== */
function saveProfile() {
  if (selectedDirs.size===0) { toast('Выбери хотя бы одно направление'); return; }
  const about    = document.getElementById('prof-about').value.trim();
  const goal     = parseInt(document.getElementById('prof-goal').value)||35;
  const prize    = document.getElementById('prof-prize').value.trim();
  const birthday = document.getElementById('prof-birthday')?.value||'';
  const gender   = document.getElementById('prof-gender')?.value||'';
  const apiKey   = document.getElementById('prof-apikey').value.trim();
  if (apiKey) localStorage.setItem('quest_api_key', apiKey);
  questProfile = { directions:[...selectedDirs], about, birthday, gender, monthGoal:Math.max(10,Math.min(100,goal)), monthPrize:prize, savedAt:Date.now() };
  localStorage.setItem('quest_profile', JSON.stringify(questProfile));
  if (!localStorage.getItem('quest_start_date')) localStorage.setItem('quest_start_date', questDateKey(today()));
  toast('Профиль сохранён \u2713');
  renderQuestScreen();
}

/* ===== API KEY HELPERS ===== */
function toggleApiKeyVisibility() { const inp=document.getElementById('prof-apikey'); if(inp) inp.type=inp.type==='password'?'text':'password'; }
async function copyApiKey() {
  const key=localStorage.getItem('quest_api_key')||document.getElementById('prof-apikey')?.value||'';
  if (!key){toast('Ключ не найден');return;}
  try { await navigator.clipboard.writeText(key); toast('API ключ скопирован \u2713'); }
  catch { const ta=document.createElement('textarea'); ta.value=key; ta.style.cssText='position:fixed;opacity:0'; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); document.body.removeChild(ta); toast('API ключ скопирован \u2713'); }
}
function previewPrizeImg(input) {
  if (!input.files?.[0]) return;
  const reader=new FileReader();
  reader.onload=e=>{
    localStorage.setItem('quest_prize_image',e.target.result);
    const preview=document.getElementById('prize-img-preview');
    if(preview){preview.style.display='block'; const img=preview.querySelector('img'); if(img) img.src=e.target.result;}
    updateQuestHeader(); toast('Фото приза сохранено \u2713');
  };
  reader.readAsDataURL(input.files[0]);
}
function clearPrizeImg() {
  localStorage.removeItem('quest_prize_image');
  const preview=document.getElementById('prize-img-preview');
  if(preview){preview.style.display='none'; const img=preview.querySelector('img'); if(img) img.src='';}
  const inp=document.getElementById('prof-prize-img'); if(inp) inp.value='';
  updateQuestHeader(); toast('Фото приза удалено');
}

/* ===== HISTORY SCREEN ===== */
function renderHistoryScreen() {
  const root=document.getElementById('quest-root');
  const months=JSON.parse(localStorage.getItem('quest_months')||'{}');
  const entries=Object.entries(months).sort(([a],[b])=>b.localeCompare(a));
  const MONTHS_ACC=['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
  if (!entries.length) {
    root.innerHTML=`<div style="text-align:center;padding:40px 0;color:var(--text3)"><div style="font-size:2.5rem;margin-bottom:12px">📊</div><div style="font-size:13px">История месяцев пока пуста</div></div><button class="btn-edit-profile" onclick="renderQuestScreen()">\u2190 Назад</button>`;
    return;
  }
  const rows=entries.map(([key,r])=>{
    const [yr,mo]=key.replace('cycle_','').split('-').map(Number);
    const mIdx = r.month ? parseInt(r.month.split('-')[1])-1 : 0;
    const mYear = r.month ? parseInt(r.month.split('-')[0]) : new Date().getFullYear();
    const name=`${MONTHS_ACC[mIdx]||'—'} ${mYear}`;
    const win=r.stars>=r.goal;
    return `<div style="display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--border)">
      <div style="font-size:1.5rem">${win?'🏆':'💪'}</div>
      <div style="flex:1"><div style="font-size:13px;font-weight:700;color:var(--text)">${name}</div>
      <div style="font-size:11px;color:var(--text3)">\u2B50 ${r.stars}/${r.goal} \u00B7 \u2713 ${r.daysDone} дн. \u00B7 🔥 ${r.bestStreak} серия</div></div>
      <div style="font-size:12px;font-weight:700;color:${win?'var(--amber)':'var(--text3)'}">${win?'+приз':''}</div>
    </div>`;
  }).join('');
  root.innerHTML=`<div style="font-size:13px;font-weight:700;color:var(--text);margin-bottom:4px">📊 История месяцев</div><div>${rows}</div><button class="btn-edit-profile" style="margin-top:16px" onclick="renderQuestScreen()">\u2190 Назад</button>`;
}

/* ===== MARK QUEST ===== */
function markQuest(done) {
  const key=questDateKey(today()), log=questLog[key];
  if (!log) return;
  const stars=done?2:(log.frozen?0:-2);
  questLog[key]={...log,done,stars};
  localStorage.setItem('quest_log',JSON.stringify(questLog));
  if (done) {
    checkMorningBonus(); checkBirthdayBonus();
    const streak=questStreakDays();
    if (streak>0 && streak%7===0) {
      const bonusKey=`${questDateKey(today())}_bonus_streak${streak}`;
      if (!questLog[bonusKey]) { questLog[bonusKey]={stars:5,type:'streak_bonus'}; localStorage.setItem('quest_log',JSON.stringify(questLog)); setTimeout(()=>toast(`🔥 Серия ${streak} дней! +5\u2B50 бонус!`,4000),400); }
    }
  }
  renderQuestScreen();
}

/* ===== BONUSES ===== */
function checkMorningBonus() {
  if (new Date().getHours()>=10) return;
  const key=`${questDateKey(today())}_bonus_morning`;
  if (questLog[key]) return;
  questLog[key]={stars:1,type:'morning_bonus'}; localStorage.setItem('quest_log',JSON.stringify(questLog));
  setTimeout(()=>toast('🌅 Утреннее выполнение! +1\u2B50',3500),600);
}
function checkBirthdayBonus() {
  if (!questProfile?.birthday) return;
  const t=today(), bday=parseDate(questProfile.birthday);
  if (bday.getMonth()!==t.getMonth()||bday.getDate()!==t.getDate()) return;
  const key=`${questDateKey(today())}_bonus_birthday`;
  if (questLog[key]) return;
  questLog[key]={stars:10,type:'birthday_bonus'}; localStorage.setItem('quest_log',JSON.stringify(questLog));
  setTimeout(()=>toast('🎂 С Днём рождения! +10\u2B50 праздничный бонус! 🎉',5000),800);
}
function checkTenEventsBonus() {
  if (events.length<10) return;
  const bonuses=JSON.parse(localStorage.getItem('quest_bonuses')||'{}');
  if (bonuses.ten_events) return;
  bonuses.ten_events=true; localStorage.setItem('quest_bonuses',JSON.stringify(bonuses));
  const key=`${questDateKey(today())}_bonus_ten_events`;
  if (!questLog[key]) { questLog[key]={stars:5,type:'ten_events_bonus'}; localStorage.setItem('quest_log',JSON.stringify(questLog)); toast('🗓️ 10 событий в календаре! +5\u2B50 бонус!',4000); }
}

/* ===== SPEND ===== */
function spendStars(amount, reason) {
  const current=questStarsThisMonth();
  if (current<amount) { toast(`Недостаточно звёзд — нужно ${amount}\u2B50, есть ${current}\u2B50`); return false; }
  const key=`${questDateKey(today())}_spend_${Date.now()}`;
  questLog[key]={stars:-amount,type:'spend',reason}; localStorage.setItem('quest_log',JSON.stringify(questLog));
  toast(`${reason} \u2212${amount}\u2B50`); return true;
}
function replaceTask() {
  const key=questDateKey(today()), old=questLog[key];
  if (!spendStars(2,'🔄 Замена задания')) return;
  delete questLog[key]; localStorage.setItem('quest_log',JSON.stringify(questLog));
  generateDailyTask({forceNew:true,noEvents:true,previousTitle:old?.task?.title}); renderQuestScreen();
}
function freezeDay() {
  const key=questDateKey(today());
  if (questLog[key]?.done!==undefined){toast('Сегодня уже отмечено');return;}
  if (questLog[key]?.frozen){toast('День уже заморожен ❄️');return;}
  if (!spendStars(2,'❄️ Заморозка дня')) return;
  questLog[key]={...(questLog[key]||{}),frozen:true}; localStorage.setItem('quest_log',JSON.stringify(questLog));
  toast('День заморожен ❄️'); renderQuestScreen();
}

/* ===== DIRECTION PICKER ===== */
function openDirPicker() {
  const key=questDateKey(today());
  if (questLog[key]?.done!==undefined){toast('Задание уже выполнено');return;}
  const grid=document.getElementById('dir-pick-grid');
  grid.innerHTML=DIRECTIONS.filter(d=>questProfile?.directions?.includes(d.key)).map(d=>`<div class="dir-pick-chip" data-key="${d.key}" onclick="selectDirForTask(this,'${d.key}')"><span style="font-size:18px">${d.emoji}</span><span>${d.label}</span></div>`).join('');
  pendingForcedDirection=null; document.getElementById('dir-pick-overlay').classList.add('open');
}
function selectDirForTask(el,key) { document.querySelectorAll('.dir-pick-chip').forEach(c=>c.classList.remove('selected')); el.classList.add('selected'); pendingForcedDirection=key; }
function confirmDirPick() {
  if (!pendingForcedDirection){toast('Выбери направление');return;}
  const dir=pendingForcedDirection;
  if (!spendStars(2,'🎯 Выбор направления')){closeDirPicker();return;}
  const todayKey=questDateKey(today()), old=questLog[todayKey];
  delete questLog[todayKey]; localStorage.setItem('quest_log',JSON.stringify(questLog));
  closeDirPicker(); generateDailyTask({forcedDirection:dir,previousTitle:old?.task?.title}); renderQuestScreen();
}
function closeDirPicker() { document.getElementById('dir-pick-overlay').classList.remove('open'); pendingForcedDirection=null; }
function handleDirPickOverlay(e) { if (e.target.id==='dir-pick-overlay') closeDirPicker(); }

/* ===== TASK GENERATION ===== */
function getUrgentEvent() {
  const t=today();
  for (let ahead=0;ahead<=1;ahead++) {
    const check=new Date(t.getFullYear(),t.getMonth(),t.getDate()+ahead);
    const mm=check.getMonth(),dd=check.getDate();
    const found=events.find(ev=>{const p=parseDate(ev.date);return ev.type==='once'?p.getFullYear()===check.getFullYear()&&p.getMonth()===mm&&p.getDate()===dd:p.getMonth()===mm&&p.getDate()===dd;});
    if (found) {
      const when=ahead===0?'СЕГОДНЯ':'ЗАВТРА';
      const cat=found.category?categories[found.category]?.name:'';
      return `${when}: "${found.name}"${cat?` [${cat}]`:''}`;
    }
  }
  return null;
}
function getRecentTaskTitles() {
  const t=today(), titles=[];
  for (let i=1;i<=14;i++) { const d=new Date(t.getFullYear(),t.getMonth(),t.getDate()-i); const log=questLog[questDateKey(d)]; if (log?.task?.title) titles.push(log.task.title); }
  return titles;
}

async function generateDailyTask(options={}) {
  if (isGenerating) return;
  isGenerating=true;
  const {forceNew=false,noEvents=false,forcedDirection=null,previousTitle=null}=options;
  const todayKey=questDateKey(today());
  const apiKey=localStorage.getItem('quest_api_key');
  const endpoint='https://openrouter.ai/api/v1/chat/completions';

  const card=document.querySelector('.quest-dialogue-card');
  if (card) card.innerHTML=`<div class="quest-loading"><div class="quest-spinner"></div><span>Генерация задания дня...</span></div>`;

  if (!apiKey) {
    isGenerating=false;
    questLog[todayKey]={task:{title:'API ключ не указан',description:'Перейди в настройки профиля и введи OpenRouter API Key.',category:'Настройка',categoryEmoji:'⚙️',difficulty:'easy',duration:'2 минуты',tip:'Ключ на openrouter.ai/keys',type:'info'},generatedAt:Date.now()};
    localStorage.setItem('quest_log',JSON.stringify(questLog)); renderQuestScreen(); return;
  }

  const dirLabels=(questProfile.directions||[]).map(k=>{const d=DIRECTIONS.find(x=>x.key===k);return d?`${d.emoji} ${d.label}`:k;});
  let forcedDirLabel='';
  if (forcedDirection) { const d=DIRECTIONS.find(x=>x.key===forcedDirection); if(d) forcedDirLabel=`${d.emoji} ${d.label}`; }
  const stars=questStarsThisMonth(), streak=questStreakDays();
  const t=today(), dateStr=t.toLocaleDateString('ru',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
  const urgentEvent=noEvents?null:getUrgentEvent();
  let ageLabel='';
  if (questProfile.birthday) {
    const bday=parseDate(questProfile.birthday), t2=today();
    let age=t2.getFullYear()-bday.getFullYear();
    if (t2.getMonth()<bday.getMonth()||(t2.getMonth()===bday.getMonth()&&t2.getDate()<bday.getDate())) age--;
    if (age>0) ageLabel=`${age} лет`;
  }

  const systemPrompt=`Ты — генератор персональных ежедневных квестов QuestDay. Создавай УНИКАЛЬНЫЕ, ИНТЕРЕСНЫЕ задания. ЗАПРЕЩЕНО банальное: «выпей воды», «погуляй». Отвечай ТОЛЬКО валидным JSON без markdown:
{"title":"до 65 символов","description":"описание квеста (3-4 предложения)","category":"название","categoryEmoji":"эмодзи","difficulty":"easy|medium|hard","duration":"X минут","tip":"совет или факт","type":"interest|event|fact"}`;

  const inputData={date:dateStr,...(ageLabel?{age:ageLabel}:{}),...(questProfile.gender?{gender:questProfile.gender}:{}),interests_and_about:questProfile.about||'не указано',directions:dirLabels,progress:`\u2B50${stars}/${questProfile.monthGoal}|\uD83D\uDD25${streak}\u0434\u043D`,upcoming_events:urgentEvent?[urgentEvent]:[],recent_tasks:getRecentTaskTitles().slice(0,8),...(forceNew&&previousTitle?{mode:'replace',rejected_task:previousTitle}:{}),...(forcedDirLabel?{forced_direction:forcedDirLabel}:{})};

  const controller=new AbortController();
  const timer=setTimeout(()=>controller.abort(),30000);
  try {
    const res=await fetch(endpoint,{method:'POST',signal:controller.signal,headers:{'Content-Type':'application/json','Authorization':`Bearer ${apiKey}`,'HTTP-Referer':'https://questday.app','X-Title':'QuestDay'},body:JSON.stringify({model:'anthropic/claude-3-haiku',max_tokens:600,messages:[{role:'system',content:systemPrompt},{role:'user',content:JSON.stringify(inputData)}]})});
    clearTimeout(timer);
    if (res.status===401) throw new Error('auth');
    if (res.status===402) throw new Error('balance');
    if (res.status===429) throw new Error('rate_limit');
    if (!res.ok) { const e=await res.json().catch(()=>({})); throw new Error(e.error?.message||`HTTP ${res.status}`); }
    const data=await res.json();
    const raw=data.choices?.[0]?.message?.content||'';
    const task=JSON.parse(raw.replace(/```json|```/g,'').trim());
    questLog[todayKey]={...(questLog[todayKey]||{}),task,generatedAt:Date.now()};
    localStorage.setItem('quest_log',JSON.stringify(questLog));
    isGenerating=false; renderQuestScreen();
  } catch(err) {
    clearTimeout(timer); isGenerating=false;
    let msg='';
    if (err.name==='AbortError')         msg='⏳ Превышено время ожидания.';
    else if (err.message==='auth')       msg='❌ Неверный API ключ. Проверь в настройках.';
    else if (err.message==='balance')    msg='💳 Пополни баланс на openrouter.ai';
    else if (err.message==='rate_limit') msg='⏳ Лимит запросов. Подожди минуту.';
    else msg=`\u26A0\uFE0F ${escapeHtml(err.message)}`;
    const errCard=document.querySelector('.quest-dialogue-card');
    if (errCard) errCard.innerHTML=`<div style="padding:20px 0;text-align:center"><div style="font-size:2rem;margin-bottom:10px">\u26A0\uFE0F</div><div style="font-size:13px;color:var(--text2);margin-bottom:16px">${msg}</div><button onclick="retryGenerateTask()" style="width:100%;padding:12px;background:var(--amber-dim);color:#1C3A0E;border:1.5px solid var(--amber);border-radius:var(--radius-sm);cursor:pointer;font-family:Manrope,sans-serif;font-weight:700;font-size:13px">🔄 Попробовать снова</button></div>`;
  }
}

function getEventsForDay(y,m,d) {

}
function getEventColor(ev) { if(ev.color)return ev.color; if(ev.category)return categories[ev.category]?.color||'var(--amber)'; return 'var(--amber)'; }
function renderCalendar() {
  const t=today(); document.getElementById('cal-title').textContent=`${MONTHS_RU[calMonth]} ${calYear}`;
  const firstDay=new Date(calYear,calMonth,1), lastDay=new Date(calYear,calMonth+1,0);
  let startDow=firstDay.getDay(); startDow=startDow===0?6:startDow-1;
  let html=DAYS_SHORT.map(d=>`<div class="cal-day-name">${d}</div>`).join('');
  for(let i=0;i<startDow;i++){const dt=new Date(calYear,calMonth,i-startDow+1);html+=`<div class="cal-day other-month"><div class="cal-day-num">${dt.getDate()}</div></div>`;}
  for(let d=1;d<=lastDay.getDate();d++){
    const isToday=t.getFullYear()===calYear&&t.getMonth()===calMonth&&t.getDate()===d;
    const dateKey=`${calYear}-${String(calMonth+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const dayEvts=getEventsForDay(calYear,calMonth,d), isSelected=calSelectedDate===dateKey;
    const dots=dayEvts.slice(0,6).map(ev=>`<span class="cal-dot" style="background:${getEventColor(ev)}"></span>`).join('');
    const cls=['cal-day',isToday?'is-today':'',dayEvts.length?'has-event':'',isSelected?'cal-selected':''].filter(Boolean).join(' ');
    const click=dayEvts.length?`onclick="calSelectDay('${dateKey}')"`:'';
    html+=`<div class="${cls}" ${click}><div class="cal-day-num">${d}</div>${dots?`<div class="cal-dots">${dots}</div>`:''}</div>`;
  }
  const trailing=(startDow+lastDay.getDate())%7;
  if(trailing>0){for(let i=1;i<=7-trailing;i++) html+=`<div class="cal-day other-month"><div class="cal-day-num">${i}</div></div>`;}
  document.getElementById('cal-grid').innerHTML=html;
  document.getElementById('cal-hint').style.display=calSelectedDate?'block':'none';
}

/* ===== DURATION ===== */
function calcDuration(dateStr){
  const t=today(),e=parseDate(dateStr);
  if(t.getTime()===e.getTime())return{years:0,months:0,days:0,direction:'today'};
  const future=e>t,[from,to]=future?[t,e]:[e,t];
  let years=to.getFullYear()-from.getFullYear(),months=to.getMonth()-from.getMonth(),days=to.getDate()-from.getDate();
  if(days<0){months--;days+=new Date(to.getFullYear(),to.getMonth(),0).getDate();}
  if(months<0){years--;months+=12;}
  return{years,months,days,direction:future?'future':'past'};
}
function calcDurationBetween(from,to){
  let years=to.getFullYear()-from.getFullYear(),months=to.getMonth()-from.getMonth(),days=to.getDate()-from.getDate();
  if(days<0){months--;days+=new Date(to.getFullYear(),to.getMonth(),0).getDate();}
  if(months<0){years--;months+=12;}
  return{years,months,days};
}
function calcAnnual(dateStr){
  const t=today(),parsed=parseDate(dateStr);
  if(t.getTime()===parsed.getTime())return{isToday:true};
  const mm=parsed.getMonth(),dd=parsed.getDate();
  let futureDate=new Date(t.getFullYear(),mm,dd);
  if(futureDate<=t)futureDate=new Date(t.getFullYear()+1,mm,dd);
  return{isToday:false,passed:calcDurationBetween(parsed,t),remaining:calcDurationBetween(t,futureDate)};
}
function fmtParts(d){
  const p=[];
  if(d.years>0)p.push(`<strong>${d.years}</strong>&thinsp;${pluralYears(d.years)}`);
  if(d.months>0)p.push(`<strong>${d.months}</strong>&thinsp;мес.`);
  if(d.days>0||p.length===0)p.push(`<strong>${d.days}</strong>&thinsp;д.`);
  return p.join(' ');
}
function fmtPartsPlain(d){
  const p=[];
  if(d.years>0)p.push(`${d.years} ${pluralYears(d.years)}`);
  if(d.months>0)p.push(`${d.months} мес.`);
  if(d.days>0||p.length===0)p.push(`${d.days} д.`);
  return p.join(' ');
}
function pluralYears(n){const m10=n%10,m100=n%100;if(m10===1&&m100!==11)return'год';if([2,3,4].includes(m10)&&![12,13,14].includes(m100))return'года';return'лет';}

function renderEvents(){
  const container=document.getElementById('events-container'),sortBar=document.getElementById('sort-bar'),filterBar=document.getElementById('cat-filter-bar');

  if(calSelectedDate){const[sy,sm,sd]=calSelectedDate.split('-').map(Number);arr=arr.filter(ev=>{const dt=parseDate(ev.date);return ev.type==='once'?dt.getFullYear()===sy&&dt.getMonth()===sm-1&&dt.getDate()===sd:dt.getMonth()===sm-1&&dt.getDate()===sd;});}
  const active=arr.filter(e=>!e.done), done=arr.filter(e=>e.done);
  let html='';
  if(currentSort==='closest'){
    const upcoming=active.filter(e=>isUpcomingThisYear(e.date)), passed=active.filter(e=>!isUpcomingThisYear(e.date));
    if(upcoming.length)html+=`<div class="section"><div class="section-label">Предстоящие</div><div class="events-grid">${upcoming.map(e=>{try{return cardHTML(e);}catch(err){return '';}}).join('')}</div></div>`;
    if(passed.length)html+=`<div class="section"><div class="section-label">Прошедшие в этом году</div><div class="events-grid">${passed.map(e=>{try{return cardHTML(e);}catch(err){return '';}}).join('')}</div></div>`;
  } else {
    if(active.length)html+=`<div class="section"><div class="events-grid">${active.map(e=>{try{return cardHTML(e);}catch(err){return '';}}).join('')}</div></div>`;
  }
  if(!active.length&&!done.length)html=`<p style="color:var(--text3);font-size:13px;text-align:center;padding:2rem 0">Нет событий в этой категории</p>`;

  container.innerHTML=html;
}

function cardHTML(ev){
  const dur=calcDuration(ev.date);
  let cardClass=dur.direction==='today'?'today-card':dur.direction==='future'?'future':'past';
  const cat=ev.category?categories[ev.category]:null;
  const borderColor=ev.color||cat?.color||null;
  const borderStyle=borderColor?`style="border-left-color:${borderColor}"`:' ';
  const bell=ev.reminder?`<span class="reminder-icon"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M8 2a5 5 0 0 1 5 5v2.5l1 1.5H2l1-1.5V7a5 5 0 0 1 5-5z"/><line x1="8" y1="14" x2="8" y2="15"/><line x1="6.5" y1="15" x2="9.5" y2="15"/></svg></span>`:'';
  const ann=calcAnnual(ev.date);
  let row2;
  if(ann.isToday){row2=`<span style="color:var(--teal)"><strong>сегодня 🎉</strong></span><span></span>`;}
  else if(ev.type==='once'){const dur2=calcDuration(ev.date);if(dur2.direction==='future'){row2=`<span></span><span><span class="lbl-remaining">Через:</span> ${fmtParts(dur2)}</span>`;}else{row2=`<span><span class="lbl-passed">Прошло:</span> ${fmtParts(dur2)}</span><span></span>`;}}
  else{row2=`<span><span class="lbl-passed">Прошло:</span> ${fmtParts(ann.passed)}</span><span><span class="lbl-remaining">Через:</span> ${fmtParts(ann.remaining)}</span>`;}
  const row3=ev.note?`<div class="card-row3">📝 ${escapeHtml(ev.note)}</div>`:'';
  return `<div class="event-card ${cardClass}${ev.done?' done':''}" id="card-${ev.id}" ${borderStyle} onclick="openDrawer('${ev.id}')">
    <div class="card-row1"><span class="event-name">${escapeHtml(ev.name)}${cat?`<span class="cat-emoji-inline">${cat.emoji}</span>`:''}</span><span class="event-date">${formatDateRu(ev.date)}</span>${bell}</div>
    <div class="card-row2">${row2}</div>${row3}</div>`;
}
