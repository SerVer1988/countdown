  <button class="drawer-btn danger" onclick="drawerDelete()"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><polyline points="3,5 17,5"/><path d="M8 5V3h4v2"/><path d="M4 5l1.5 12a1 1 0 0 0 1 .9h7a1 1 0 0 0 1-.9L16 5"/><line x1="8.5" y1="9" x2="8.5" y2="14"/><line x1="11.5" y1="9" x2="11.5" y2="14"/></svg>Удалить событие</button>`;
  document.getElementById('drawer-actions').innerHTML=html;
  document.getElementById('drawer-overlay').classList.add('open');
}
function closeDrawer(){document.getElementById('drawer-overlay').classList.remove('open');drawerEventId=null;}
function handleDrawerOverlayClick(e){if(e.target.id==='drawer-overlay')closeDrawer();}
function drawerToggleDone(){const id=drawerEventId;closeDrawer();toggleDone(id);}
function drawerShare(){const id=drawerEventId;closeDrawer();shareEvent(id);}
function drawerExportICS(){const id=drawerEventId;closeDrawer();exportICS(id);}
function drawerEdit(){const id=drawerEventId;closeDrawer();openEditModal(id);}
function drawerDelete(){const id=drawerEventId;closeDrawer();deleteEvent(id);}

/* ===== MODAL ===== */
function selectCat(el){const cat=el.dataset.cat,was=el.classList.contains('selected');document.querySelectorAll('.cat-chip').forEach(c=>c.classList.remove('selected'));if(was){selectedCat=null;return;}el.classList.add('selected');selectedCat=cat;const catColor=categories[cat]?.color;if(catColor&&!selectedColor){selectedColor=catColor;highlightSwatch(catColor);}}
function selectSwatch(el){document.querySelectorAll('.color-swatch').forEach(s=>s.classList.remove('selected'));el.classList.add('selected');selectedColor=el.dataset.color;}
function onCustomColor(input){document.querySelectorAll('.color-swatch').forEach(s=>s.classList.remove('selected'));selectedColor=input.value;}
function highlightSwatch(color){document.querySelectorAll('.color-swatch').forEach(s=>s.classList.toggle('selected',s.dataset.color===color));}
function setEventType(type){selectedType=type;document.getElementById('type-annual').classList.toggle('active',type==='annual');document.getElementById('type-once').classList.toggle('active',type==='once');}
function resetCatColor(){selectedCat=null;selectedColor=null;document.querySelectorAll('.cat-chip').forEach(c=>c.classList.remove('selected'));document.querySelectorAll('.color-swatch').forEach(s=>s.classList.remove('selected'));document.getElementById('inp-color-custom').value='#ffffff';}
function setCatFilter(cat){activeCatFilter=(activeCatFilter===cat)?'all':cat;renderEvents();}
function openModal(){editingId=null;document.getElementById('modal-title').textContent='Новое событие';document.getElementById('inp-name').value='';document.getElementById('inp-date').value='';document.getElementById('inp-note').value='';resetReminder();resetCatColor();setEventType('annual');renderCatPicker(null);document.getElementById('modal-overlay').classList.add('open');setTimeout(()=>document.getElementById('inp-name').focus(),50);}
function openEditModal(id){
  const ev=events.find(e=>e.id===id); if(!ev)return; editingId=id;
  document.getElementById('modal-title').textContent='Редактировать событие';
  document.getElementById('inp-name').value=ev.name; document.getElementById('inp-date').value=ev.date; document.getElementById('inp-note').value=ev.note||'';
  resetReminder(); resetCatColor(); setEventType(ev.type||'annual'); renderCatPicker(ev.category||null);
  if(ev.category){selectedCat=ev.category;const catColor=categories[ev.category]?.color;if(catColor&&!ev.color){selectedColor=catColor;highlightSwatch(catColor);}}
  if(ev.color){selectedColor=ev.color;const swatch=document.querySelector(`.color-swatch[data-color="${ev.color}"]`);if(swatch)swatch.classList.add('selected');else document.getElementById('inp-color-custom').value=ev.color;}
  if(ev.reminder){reminderActive=true;document.getElementById('reminder-toggle').classList.add('active');document.getElementById('reminder-chips').classList.add('visible');document.querySelectorAll('.day-chip').forEach(c=>c.classList.toggle('selected',ev.reminderDays.includes(Number(c.dataset.days))));}
  document.getElementById('modal-overlay').classList.add('open');
}
function closeModal(){document.getElementById('modal-overlay').classList.remove('open');}
function handleOverlayClick(e){if(e.target===document.getElementById('modal-overlay'))closeModal();}
function resetReminder(){reminderActive=false;document.getElementById('reminder-toggle').classList.remove('active');document.getElementById('reminder-chips').classList.remove('visible');document.querySelectorAll('.day-chip').forEach((c,i)=>c.classList.toggle('selected',i===0));}
function toggleReminder(){reminderActive=!reminderActive;document.getElementById('reminder-toggle').classList.toggle('active',reminderActive);document.getElementById('reminder-chips').classList.toggle('visible',reminderActive);if(reminderActive)requestNotificationPermission();}
function toggleChip(el){el.classList.toggle('selected');}

/* ===== SAVE / DELETE ===== */
function saveEvent(){
  const name=document.getElementById('inp-name').value.trim(), date=document.getElementById('inp-date').value, note=document.getElementById('inp-note').value.trim();
  if(!name){shake('inp-name');return;} if(!date){shake('inp-date');return;}
  const reminderDays=reminderActive?Array.from(document.querySelectorAll('.day-chip.selected')).map(c=>Number(c.dataset.days)):[];
  const ev={id:editingId||Date.now().toString(36)+Math.random().toString(36).slice(2,6),name,date,note,type:selectedType,category:selectedCat||null,color:selectedColor||null,reminder:reminderActive&&reminderDays.length>0,reminderDays,createdAt:editingId?(events.find(e=>e.id===editingId)?.createdAt||Date.now()):Date.now()};
  if(editingId){const idx=events.findIndex(e=>e.id===editingId);events[idx]=ev;}else{events.push(ev);}
  save(); renderEvents(); closeModal(); toast(editingId?`«${name}» обновлено`:`«${name}» добавлено`); scheduleReminders(); checkTenEventsBonus();
}
function deleteEvent(id){const ev=events.find(e=>e.id===id);if(!ev)return;if(!confirm(`Удалить «${ev.name}»?`))return;events=events.filter(e=>e.id!==id);save();renderEvents();toast(`«${ev.name}» удалено`);}
function loadEvents(){return JSON.parse(localStorage.getItem('countdown_events')||'[]');}
function saveEvents(arr){events=arr;localStorage.setItem('countdown_events',JSON.stringify(arr));}
function save(){localStorage.setItem('countdown_events',JSON.stringify(events));}
function shake(id){const el=document.getElementById(id);el.style.borderColor='var(--red)';el.style.animation='shake 0.3s ease';setTimeout(()=>{el.style.animation='';el.style.borderColor='';},400);}

/* ===== TOAST ===== */
function toast(msg,duration=3000){const c=document.getElementById('toast-container'),t=document.createElement('div');t.className='toast';t.innerHTML=msg;c.appendChild(t);setTimeout(()=>{t.style.opacity='0';t.style.transform='translateX(20px)';t.style.transition='all 0.3s';setTimeout(()=>t.remove(),300);},duration);}

/* ===== NOTIFICATIONS ===== */
function requestNotificationPermission(){if(!('Notification'in window))return;if(Notification.permission==='default')Notification.requestPermission().then(p=>{if(p==='granted')toast('Уведомления включены \u2713');else toast('Уведомления отклонены');});}
function scheduleReminders(){if(!('Notification'in window)||Notification.permission!=='granted')return;const now=today();events.forEach(ev=>{if(!ev.reminder)return;ev.reminderDays.forEach(days=>{const target=new Date(parseDate(ev.date));target.setDate(target.getDate()-days);const msUntil=target-now;if(msUntil>=0&&msUntil<86400000*2){setTimeout(()=>{new Notification(`Напоминание: ${ev.name}`,{body:days===0?'Событие сегодня!':`До события осталось ${days} д.`,icon:'data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32"><text y="28" font-size="28">📅</text></svg>'});},msUntil>0?msUntil:0);}});});}
function checkDailyReminders(){if(!('Notification'in window)||Notification.permission!=='granted')return;events.forEach(ev=>{if(!ev.reminder)return;const diff=diffDays(ev.date);ev.reminderDays.forEach(days=>{if(diff===days){setTimeout(()=>{new Notification(`Напоминание: ${ev.name}`,{body:days===0?'Событие сегодня!':`До события осталось ${days} д.`});},500);if(days===0||days===1)toast(`<strong>🔔 ${ev.name}</strong><br>${days===0?'Событие сегодня!':'Событие завтра!'}`);} });});}

/* ===== EXPORT ICS ===== */
function exportICS(id){
  const ev=events.find(e=>e.id===id); if(!ev)return;
  const[y,m,d]=ev.date.split('-').map(Number);
  const dtStart=`${String(y).padStart(4,'0')}${String(m).padStart(2,'0')}${String(d).padStart(2,'0')}`;
  const end=new Date(y,m-1,d+1);
  const dtEnd=`${end.getFullYear()}${String(end.getMonth()+1).padStart(2,'0')}${String(end.getDate()).padStart(2,'0')}`;
  const rrule=(ev.type!=='once')?'\r\nRRULE:FREQ=YEARLY':'';
  const desc=ev.note?`DESCRIPTION:${ev.note.replace(/\n/g,' ')}\r\n`:'';
  const ics=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//QuestDay//RU','CALSCALE:GREGORIAN','BEGIN:VEVENT',`UID:${ev.id}@questday`,`DTSTART;VALUE=DATE:${dtStart}`,`DTEND;VALUE=DATE:${dtEnd}`,`SUMMARY:${ev.name}${rrule}`,`${desc}END:VEVENT`,'END:VCALENDAR'].join('\r\n');
  const blob=new Blob([ics],{type:'text/calendar;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');
  a.href=url; a.download=`${ev.name.replace(/[^а-яёa-z0-9]/gi,'_')}.ics`; document.body.appendChild(a); a.click(); document.body.removeChild(a); setTimeout(()=>URL.revokeObjectURL(url),1000);
  toast(`Добавлен в календарь: <strong>${escapeHtml(ev.name)}</strong> \u2713`);
}

/* ===== SHARE ===== */
async function shareEvent(id){
  const ev=events.find(e=>e.id===id); if(!ev)return;
  const ann=calcAnnual(ev.date),cat=ev.category?categories[ev.category]:null;
  let timeText=ann.isToday?'Сегодня! 🎉':ev.type==='once'?(()=>{const dur2=calcDuration(ev.date);return dur2.direction==='future'?`Через: ${fmtPartsPlain(dur2)}`:`Прошло: ${fmtPartsPlain(dur2)}`;})():`Прошло: ${fmtPartsPlain(ann.passed)} \u00B7 Через: ${fmtPartsPlain(ann.remaining)}`;
  const emoji=cat?cat.emoji+' ':'📅 ',catStr=cat?` (${cat.name})`:'',note=ev.note?`\n📝 ${ev.note}`:'';
  const text=`${emoji}${ev.name}${catStr}\n📆 ${formatDateRu(ev.date)}\n${timeText}${note}`;
  try{if(navigator.share)await navigator.share({title:ev.name,text});else{await navigator.clipboard.writeText(text);toast('Скопировано \u2713');}}catch{const ta=document.createElement('textarea');ta.value=text;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();document.execCommand('copy');document.body.removeChild(ta);toast('Скопировано \u2713');}
}

/* ===== IMPORT / EXPORT ===== */
function importData(event){
  const file=event.target.files[0]; if(!file)return;
  const reader=new FileReader();
  reader.onload=e=>{
    try{
      const data=JSON.parse(e.target.result), incoming=Array.isArray(data)?data:(data.events||[]);
      if(!incoming.length){toast('Файл пуст или неверный формат');return;}
      const existing=loadEvents(), existingIds=new Set(existing.map(ev=>ev.id));
      let added=0;
      incoming.forEach(ev=>{if(!ev.name||!ev.date)return;const id=ev.id||`${Date.now()}-${Math.random().toString(36).slice(2,7)}`;if(existingIds.has(id))return;existing.push({id,name:ev.name,date:ev.date,note:ev.note||'',type:ev.type||'annual',category:ev.category||null,color:ev.color||null,done:ev.done||false,reminder:ev.reminder||false,reminderDays:ev.reminderDays||[],createdAt:ev.createdAt||Date.now()});added++;});
      saveEvents(existing); renderEvents(); toast(`Импортировано: <strong>${added}</strong> событий \u2713`);
    }catch(err){toast('Ошибка чтения файла.');console.error(err);}finally{event.target.value='';}
  };
  reader.readAsText(file);
}
function downloadData(){
  const evs=loadEvents(); if(!evs.length){toast('Нет событий для экспорта');return;}
  const data={exported:new Date().toISOString().slice(0,10),events:evs.map(ev=>({id:ev.id,name:ev.name,date:ev.date,note:ev.note||'',type:ev.type||'annual',category:ev.category||null,color:ev.color||null,done:ev.done||false,reminder:ev.reminder||false,reminderDays:ev.reminderDays||[],createdAt:ev.createdAt||null}))};
  const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');
  a.href=url; a.download=`questday-${data.exported}.json`; document.body.appendChild(a); a.click(); document.body.removeChild(a); setTimeout(()=>URL.revokeObjectURL(url),1000);
  toast(`Данные (${evs.length} событий) скачаны \u2713`);
}

/* ===== INIT ===== */
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeDrawer();closeModal();}});

function initApp(){
  events=loadEvents();
  checkMonthEnd();
  updateQuestHeader();
  switchTab('quest');
  checkDailyReminders();
  scheduleReminders();
}

if(document.readyState==='loading'){document.addEventListener('DOMContentLoaded',initApp);}else{initApp();}

document.addEventListener('visibilitychange',()=>{if(!document.hidden){events=loadEvents();renderEvents();}});
setInterval(()=>{updateQuestHeader();renderEvents();},60000);

if('serviceWorker'in navigator){navigator.serviceWorker.register('./sw.js').then(reg=>reg.update()).catch(()=>{});}

function id(x){return document.getElementById(x);}
